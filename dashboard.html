<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Admin - Kritik & Saran</title>

    <link rel="stylesheet" href="dashboard.css">

    <style>
        .btn-hapus {
            margin-top: 12px;
            width: 100%;
            border: none;
            padding: 11px 16px;
            background: #f3e1df;
            color: #9b3f36;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-hapus:hover {
            background: #eaccca;
        }
    </style>
</head>

<body>

    <header class="dashboard-header">
        <div>
            <h1>Dashboard Admin</h1>
            <p>Kelola Kritik & Saran Pengunjung</p>
        </div>

        <button class="btn-logout" onclick="logout()">
            🚪 Logout
        </button>
    </header>


    <main class="dashboard-container">

        <div class="dashboard-title">
            <h2>📋 Data Kritik & Saran</h2>

            <button class="btn-refresh" onclick="loadKritik()">
                🔄 Refresh
            </button>
        </div>


        <div id="loading" class="loading">
            🔄 Memuat data...
        </div>


        <div id="dataKritik" class="data-kritik"></div>

    </main>


    <script>

        const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbxdCWnGt0Vtt6K4MQ3G_q5RhCI0Gqxk6K8A8Ez8gt3Cqy-0yMNk6AzlcTSQ5v8hjgJAKA/exec";


        // ==============================
        // CEK LOGIN
        // ==============================

        if (sessionStorage.getItem("adminLoggedIn") !== "true") {
            window.location.href = "admin.html";
        }


        // ==============================
        // LOAD DATA KRITIK & SARAN
        // ==============================

        function loadKritik() {

            document.getElementById("loading").style.display = "block";

            const callbackName =
                "callbackDashboard" + Date.now();

            window[callbackName] = function(response) {

                document.getElementById("loading").style.display = "none";

                if (!response.success) {

                    document.getElementById("dataKritik").innerHTML =
                        "<p>❌ Gagal mengambil data.</p>";

                    delete window[callbackName];

                    return;
                }


                tampilkanData(response.data);

                delete window[callbackName];
            };


            const script = document.createElement("script");

            script.src =
                SCRIPT_URL +
                "?callback=" +
                callbackName;


            document.body.appendChild(script);
        }


        // ==============================
        // TAMPILKAN DATA
        // ==============================

        function tampilkanData(data) {

            const container =
                document.getElementById("dataKritik");


            if (!data || data.length === 0) {

                container.innerHTML = `
                    <div class="empty-data">
                        📭 Belum ada kritik atau saran.
                    </div>
                `;

                return;
            }


            // Lewati header spreadsheet
            const rows = data.slice(1);


            if (rows.length === 0) {

                container.innerHTML = `
                    <div class="empty-data">
                        📭 Belum ada kritik atau saran.
                    </div>
                `;

                return;
            }


            container.innerHTML = rows.map(item => {

                const sudahDitanggapi =
                    item.status === "Sudah Ditanggapi";


                return `

                    <div class="kritik-card">

                        <div class="kritik-header">

                            <div>
                                <h3>👤 ${escapeHTML(item.nama)}</h3>

                                <span>
                                    Kode: ${escapeHTML(item.kode)}
                                </span>
                            </div>

                            <span class="status-badge
                                ${sudahDitanggapi
                                    ? "status-sudah"
                                    : "status-belum"}">

                                ${
                                    sudahDitanggapi
                                    ? "✓ Sudah Ditanggapi"
                                    : "⏳ Belum Ditanggapi"
                                }

                            </span>

                        </div>


                        <div class="kritik-info">

                            <p>
                                <strong>📍 Asal:</strong>
                                ${escapeHTML(item.asal)}
                            </p>

                            <p>
                                <strong>🏷️ Kategori:</strong>
                                ${escapeHTML(item.kategori)}
                            </p>

                            <p>
                                <strong>📅 Tanggal:</strong>
                                ${escapeHTML(item.tanggal)}
                            </p>

                        </div>


                        <div class="saran-box">

                            <strong>💬 Kritik / Saran</strong>

                            <p>
                                ${escapeHTML(item.saran)}
                            </p>

                        </div>


                        <div class="tanggapan-box">

                            <strong>🛡️ Tanggapan Admin</strong>

                            ${
                                sudahDitanggapi

                                ?

                                `
                                <div class="tanggapan-sudah">

                                    ${escapeHTML(item.tanggapan)}

                                </div>
                                `

                                :

                                `

                                <textarea
                                    id="tanggapan-${item.baris}"
                                    placeholder="Tulis tanggapan untuk pengunjung..."
                                ></textarea>

                                <button
                                    class="btn-tanggapan"
                                    onclick="kirimTanggapan(${item.baris})"
                                >

                                    💬 Simpan Tanggapan

                                </button>

                                `
                            }

                        </div>


                        <!-- TOMBOL HAPUS -->

                        <button
                            class="btn-hapus"
                            onclick="hapusKritik(${item.baris})"
                        >

                            🗑️ Hapus Data

                        </button>

                    </div>

                `;

            }).join("");
        }


        // ==============================
        // KIRIM TANGGAPAN
        // ==============================

        function kirimTanggapan(baris) {

            const textarea =
                document.getElementById(
                    "tanggapan-" + baris
                );


            if (!textarea) return;


            const tanggapan =
                textarea.value.trim();


            if (!tanggapan) {

                alert("⚠️ Tanggapan belum diisi.");

                return;
            }


            const callbackName =
                "callbackTanggapan" + Date.now();


            window[callbackName] = function(response) {

                if (response.success) {

                    alert("✅ Tanggapan berhasil disimpan.");

                    loadKritik();

                } else {

                    alert(
                        "❌ Gagal menyimpan tanggapan: " +
                        (response.message || "")
                    );

                }


                delete window[callbackName];
            };


            const script =
                document.createElement("script");


            script.src =
                SCRIPT_URL +
                "?action=tanggapan" +
                "&baris=" +
                encodeURIComponent(baris) +
                "&tanggapan=" +
                encodeURIComponent(tanggapan) +
                "&callback=" +
                encodeURIComponent(callbackName);


            document.body.appendChild(script);
        }


        // ==============================
        // HAPUS DATA
        // ==============================

        function hapusKritik(baris) {

            const yakin = confirm(
                "⚠️ Apakah kamu yakin ingin menghapus data ini?"
            );


            if (!yakin) {
                return;
            }


            const callbackName =
                "callbackHapus" + Date.now();


            window[callbackName] = function(response) {

                if (response.success) {

                    alert("🗑️ Data berhasil dihapus.");

                    loadKritik();

                } else {

                    alert(
                        "❌ Gagal menghapus data: " +
                        (response.message || "")
                    );

                }


                delete window[callbackName];
            };


            const script =
                document.createElement("script");


            script.src =
                SCRIPT_URL +
                "?action=hapus" +
                "&baris=" +
                encodeURIComponent(baris) +
                "&callback=" +
                encodeURIComponent(callbackName);


            document.body.appendChild(script);
        }


        // ==============================
        // ESCAPE HTML
        // ==============================

        function escapeHTML(text) {

            if (text === null || text === undefined) {
                return "";
            }


            return String(text)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");
        }


        // ==============================
        // LOGOUT
        // ==============================

        function logout() {

            sessionStorage.removeItem(
                "adminLoggedIn"
            );

            window.location.href =
                "admin.html";
        }


        // ==============================
        // LOAD DATA SAAT HALAMAN DIBUKA
        // ==============================

        loadKritik();

    </script>

</body>
</html>
