<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Admin - Kritik & Saran</title>

    <link rel="stylesheet" href="dashboard.css">

    <style>
        /* TOMBOL HAPUS */
        .btn-hapus {
            width: 100%;
            margin-top: 12px;
            padding: 11px 16px;

            border: none;
            border-radius: 12px;

            background: #f3e1df;
            color: #9b3f36;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        .btn-hapus:hover {
            background: #eaccca;
        }
    </style>
</head>

<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="admin-navbar">

        <div class="admin-logo">
            🌿 Desa Sepinggan Kecil
        </div>

        <div class="admin-nav-right">

            <span class="admin-name">
                👤 Admin
            </span>

            <button
                class="logout-button"
                onclick="logout()"
            >
                🚪 Logout
            </button>

        </div>

    </nav>



    <!-- =========================
         DASHBOARD
    ========================== -->

    <main class="dashboard">


        <!-- =========================
             WELCOME
        ========================== -->

        <section class="welcome">

            <div class="welcome-label">
                ADMIN DASHBOARD
            </div>

            <h1>
                Selamat Datang, Admin 👋
            </h1>

            <p>
                Kelola kritik dan saran dari pengunjung
                website Desa Sepinggan Kecil.
            </p>

        </section>



        <!-- =========================
             STATISTIK
        ========================== -->

        <section class="stats">


            <!-- TOTAL -->

            <div class="stat-card">

                <div class="stat-icon">
                    💬
                </div>

                <div>

                    <p>
                        Total Kritik & Saran
                    </p>

                    <h2 id="totalData">
                        0
                    </h2>

                </div>

            </div>



            <!-- BELUM -->

            <div class="stat-card">

                <div class="stat-icon">
                    📩
                </div>

                <div>

                    <p>
                        Belum Ditanggapi
                    </p>

                    <h2 id="belumData">
                        0
                    </h2>

                </div>

            </div>



            <!-- SUDAH -->

            <div class="stat-card">

                <div class="stat-icon">
                    ✅
                </div>

                <div>

                    <p>
                        Sudah Ditanggapi
                    </p>

                    <h2 id="sudahData">
                        0
                    </h2>

                </div>

            </div>

        </section>



        <!-- =========================
             DATA PENGUNJUNG
        ========================== -->

        <section class="data-section">


            <div class="section-title">

                <span>
                    DATA PENGUNJUNG
                </span>

                <h2>
                    Kritik & Saran
                </h2>

            </div>


            <!-- LOADING -->

            <div
                id="loading"
                class="loading"
            >
                🔄 Memuat data...
            </div>


            <!-- DATA -->

            <div
                id="dataKritik"
                class="data-kritik"
            ></div>


        </section>

    </main>



    <!-- FOOTER -->

    <footer>
        © 2026 Desa Sepinggan Kecil
    </footer>



    <script>


        // ==============================
        // URL GOOGLE APPS SCRIPT
        // ==============================

        const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbxdCWnGt0Vtt6K4MQ3G_q5RhCI0Gqxk6K8A8Ez8gt3Cqy-0yMNk6AzlcTSQ5v8hjgJAKA/exec";



        // ==============================
        // CEK LOGIN
        // ==============================

        if (
            sessionStorage.getItem("adminLoggedIn")
            !== "true"
        ) {

            window.location.href =
                "admin.html";

        }



        // ==============================
        // LOAD DATA
        // ==============================

        function loadKritik() {

            document.getElementById("loading")
                .style.display = "block";


            const callbackName =
                "callbackDashboard" + Date.now();


            window[callbackName] =
                function(response) {


                    document.getElementById("loading")
                        .style.display = "none";


                    if (!response.success) {

                        document.getElementById(
                            "dataKritik"
                        ).innerHTML = `

                            <div class="empty-data">

                                <div class="empty-icon">
                                    ⚠️
                                </div>

                                <h3>
                                    Gagal memuat data
                                </h3>

                                <p>
                                    Periksa koneksi dan URL
                                    Google Apps Script.
                                </p>

                            </div>

                        `;

                        delete window[callbackName];

                        return;
                    }


                    tampilkanData(response.data);


                    delete window[callbackName];

                };


            const script =
                document.createElement("script");


            script.src =
                SCRIPT_URL +
                "?callback=" +
                encodeURIComponent(callbackName);


            document.body.appendChild(script);

        }



        // ==============================
        // TAMPILKAN DATA
        // ==============================

        function tampilkanData(data) {


            const container =
                document.getElementById(
                    "dataKritik"
                );


            // ==============================
            // DATA KOSONG
            // ==============================

            if (
                !data ||
                data.length <= 1
            ) {

                document.getElementById(
                    "totalData"
                ).textContent = "0";


                document.getElementById(
                    "belumData"
                ).textContent = "0";


                document.getElementById(
                    "sudahData"
                ).textContent = "0";


                container.innerHTML = `

                    <div class="empty-data">

                        <div class="empty-icon">
                            📭
                        </div>

                        <h3>
                            Belum Ada Kritik & Saran
                        </h3>

                        <p>
                            Data dari pengunjung
                            akan muncul di sini.
                        </p>

                    </div>

                `;

                return;
            }



            // ==============================
            // LEWATI HEADER
            // ==============================

            const rows =
                data.slice(1);



            // ==============================
            // HITUNG STATISTIK
            // ==============================

            const total =
                rows.length;


            const sudah =
                rows.filter(
                    item =>
                    item.status ===
                    "Sudah Ditanggapi"
                ).length;


            const belum =
                total - sudah;



            document.getElementById(
                "totalData"
            ).textContent = total;


            document.getElementById(
                "belumData"
            ).textContent = belum;


            document.getElementById(
                "sudahData"
            ).textContent = sudah;



            // ==============================
            // TAMPILKAN CARD
            // ==============================

            container.innerHTML =
                rows.map(item => {


                    const sudahDitanggapi =
                        item.status ===
                        "Sudah Ditanggapi";


                    return `

                        <div class="kritik-card">


                            <!-- BAGIAN ATAS -->

                            <div class="kritik-header">

                                <div>

                                    <h3>
                                        👤
                                        ${escapeHTML(
                                            item.nama
                                        )}
                                    </h3>

                                    <span>
                                        Kode:
                                        ${escapeHTML(
                                            item.kode
                                        )}
                                    </span>

                                </div>


                                <span
                                    class="
                                    status-badge
                                    ${
                                        sudahDitanggapi
                                        ? "status-sudah"
                                        : "status-belum"
                                    }
                                    "
                                >

                                    ${
                                        sudahDitanggapi
                                        ? "✓ Sudah Ditanggapi"
                                        : "⏳ Belum Ditanggapi"
                                    }

                                </span>

                            </div>



                            <!-- INFORMASI -->

                            <div class="kritik-info">


                                <p>

                                    <strong>
                                        📍 Asal:
                                    </strong>

                                    ${escapeHTML(
                                        item.asal
                                    )}

                                </p>


                                <p>

                                    <strong>
                                        🏷️ Kategori:
                                    </strong>

                                    ${escapeHTML(
                                        item.kategori
                                    )}

                                </p>


                                <p>

                                    <strong>
                                        📅 Tanggal:
                                    </strong>

                                    ${escapeHTML(
                                        item.tanggal
                                    )}

                                </p>


                            </div>



                            <!-- KRITIK / SARAN -->

                            <div class="saran-box">

                                <strong>
                                    💬 Kritik / Saran
                                </strong>

                                <p>
                                    ${
                                        escapeHTML(
                                            item.saran
                                        ) || "-"
                                    }
                                </p>

                            </div>



                            <!-- TANGGAPAN -->

                            <div class="tanggapan-box">

                                <strong>
                                    🛡️ Tanggapan Admin
                                </strong>


                                ${
                                    sudahDitanggapi

                                    ?

                                    `

                                    <div class="tanggapan-sudah">

                                        ${escapeHTML(
                                            item.tanggapan
                                        )}

                                    </div>

                                    `

                                    :

                                    `

                                    <textarea
                                        id="tanggapan-${item.baris}"
                                        placeholder="Tulis tanggapan untuk pengunjung..."
                                    ></textarea>


                                    <button
                                        class="btn-tanggapan"
                                        onclick="kirimTanggapan(${item.baris})"
                                    >

                                        💬 Simpan Tanggapan

                                    </button>

                                    `
                                }


                            </div>



                            <!-- TOMBOL HAPUS -->

                            <button
                                class="btn-hapus"
                                onclick="hapusKritik(${item.baris})"
                            >

                                🗑️ Hapus Data

                            </button>


                        </div>

                    `;

                }).join("");

        }



        // ==============================
        // KIRIM TANGGAPAN
        // ==============================

        function kirimTanggapan(baris) {


            const textarea =
                document.getElementById(
                    "tanggapan-" + baris
                );


            if (!textarea) {
                return;
            }


            const tanggapan =
                textarea.value.trim();


            if (!tanggapan) {

                alert(
                    "⚠️ Tanggapan belum diisi."
                );

                return;

            }


            const callbackName =
                "callbackTanggapan" +
                Date.now();


            window[callbackName] =
                function(response) {


                    if (response.success) {

                        alert(
                            "✅ Tanggapan berhasil disimpan."
                        );

                        loadKritik();

                    } else {

                        alert(
                            "❌ Gagal menyimpan tanggapan: " +
                            (response.message || "")
                        );

                    }


                    delete window[callbackName];

                };


            const script =
                document.createElement("script");


            script.src =
                SCRIPT_URL +
                "?action=tanggapan" +
                "&baris=" +
                encodeURIComponent(baris) +
                "&tanggapan=" +
                encodeURIComponent(tanggapan) +
                "&callback=" +
                encodeURIComponent(
                    callbackName
                );


            document.body.appendChild(script);

        }



        // ==============================
        // HAPUS DATA
        // ==============================

        function hapusKritik(baris) {


            const yakin =
                confirm(
                    "⚠️ Apakah kamu yakin ingin menghapus data ini?"
                );


            if (!yakin) {
                return;
            }


            const callbackName =
                "callbackHapus" +
                Date.now();


            window[callbackName] =
                function(response) {


                    if (response.success) {

                        alert(
                            "🗑️ Data berhasil dihapus."
                        );

                        loadKritik();

                    } else {

                        alert(
                            "❌ Gagal menghapus data: " +
                            (response.message || "")
                        );

                    }


                    delete window[callbackName];

                };


            const script =
                document.createElement("script");


            script.src =
                SCRIPT_URL +
                "?action=hapus" +
                "&baris=" +
                encodeURIComponent(baris) +
                "&callback=" +
                encodeURIComponent(
                    callbackName
                );


            document.body.appendChild(script);

        }



        // ==============================
        // ESCAPE HTML
        // ==============================

        function escapeHTML(text) {


            if (
                text === null ||
                text === undefined
            ) {

                return "";

            }


            return String(text)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        // ==============================
        // LOGOUT
        // ==============================

        function logout() {


            sessionStorage.removeItem(
                "adminLoggedIn"
            );


            window.location.href =
                "admin.html";

        }



        // ==============================
        // JALANKAN
        // ==============================

        loadKritik();

    </script>

</body>
</html>
