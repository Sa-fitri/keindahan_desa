<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin - Website Desa</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="login-icon">
                🔐
            </div>

            <h1>Admin Desa</h1>

            <p class="login-subtitle">
                Silakan masuk untuk mengakses panel admin
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                            aria-label="Tampilkan password"
                        >
                            👁
                        </button>

                    </div>
                </div>

                <button type="submit" class="login-button">
                    Masuk
                </button>

                <p id="loginStatus" class="login-status"></p>

            </form>

            <a href="index.html" class="back-link">
                ← Kembali ke Website Desa
            </a>

        </div>

    </main>

    <script>
        // NANTI URL GOOGLE APPS SCRIPT DITEMPEL DI SINI
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLOn02MhHMB_BQEyyazog77Fo2GUM3lrh58qTKXgduYdpmyoyQLc6c6ewudoATn0Mh/exec";


        // Tampilkan / sembunyikan password
        const passwordInput = document.getElementById("password");
        const showPassword = document.getElementById("showPassword");

        showPassword.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";
                showPassword.textContent = "🙈";

            } else {

                passwordInput.type = "password";
                showPassword.textContent = "👁";

            }

        });

    const passwordInput = document.getElementById("password");

        if (passwordInput.type === "password") {
            passwordInput.type = "text";

        } else {
            passwordInput.type = "password";
            showPassword.textContent = "👁";
        }

    });


    // Proses login admin
    const loginForm = document.getElementById("loginForm");
    const loginStatus = document.getElementById("loginStatus");

    loginForm.addEventListener("submit", function (event) {

        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        // Username dan password admin
        const ADMIN_USERNAME = "admin";
        const ADMIN_PASSWORD = "admin123";

        if (
            username === ADMIN_USERNAME &&
            password === ADMIN_PASSWORD
        ) {

            loginStatus.textContent = "Login berhasil!";
            loginStatus.className = "login-status success";

            sessionStorage.setItem("adminLoggedIn", "true");

            setTimeout(function () {
                window.location.href = "dashboard.html";
            }, 800);

        } else {

            loginStatus.textContent =
                "Username atau password salah.";

            loginStatus.className = "login-status error";

        }

    });

</body>
</html>
